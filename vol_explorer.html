<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>法說會事件波動率探索</title>
<style>
  :root{
    --bg:#131722; --bg2:#0e1117; --surface:#1e222d; --surface2:#242833;
    --border:#2a2e39; --text:#e8eaed; --text-strong:#ffffff; --muted:#9aa1ad;
    --accent:#2962ff; --accent-h:#1e53e5; --accent-light:#5b9cff;
    --accent-soft:rgba(41,98,255,.16);
    --rise:#f7525f; --fall:#26a69a;
    --font:'Trebuchet MS','Noto Sans TC',-apple-system,BlinkMacSystemFont,Roboto,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;}
  a{color:var(--accent-light);text-decoration:none;} a:hover{text-decoration:underline;}

  /* ══════════ 首頁（星空） ══════════ */
  #landing{position:relative;min-height:100vh;overflow:hidden;
           background:radial-gradient(ellipse at 50% 30%, #16203a 0%, #0e1117 55%, #080a10 100%);}
  #stars{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;}
  #landing .lwrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 22px;}
  .hero{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 0 30px;}
  .hero .kicker{display:inline-flex;align-items:center;gap:8px;color:var(--accent-light);font-size:13px;font-weight:700;
       letter-spacing:.14em;text-transform:uppercase;background:rgba(41,98,255,.12);border:1px solid rgba(41,98,255,.28);
       padding:6px 14px;border-radius:999px;margin-bottom:22px;}
  .hero .welcome{font-size:16px;color:var(--muted);font-weight:600;margin-bottom:8px;letter-spacing:.04em;}
  .hero h1{margin:0 0 14px;font-size:clamp(28px,5vw,46px);font-weight:800;line-height:1.18;color:var(--text-strong);}
  .hero h1 .grad{background:linear-gradient(90deg,#5b9cff,#8f7bff 55%,#5b9cff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero .lead{color:var(--muted);font-size:15px;max-width:560px;margin:0 auto 34px;line-height:1.7;}

  .hsearch{width:100%;max-width:540px;position:relative;}
  .hsearch svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none;}
  #heroInput{width:100%;background:rgba(20,26,40,.78);backdrop-filter:blur(6px);color:var(--text-strong);
       border:1.5px solid var(--border);border-radius:14px;padding:17px 20px 17px 50px;font-size:17px;font-weight:600;
       font-family:var(--font);outline:none;transition:.16s;box-shadow:0 8px 30px rgba(0,0,0,.4);}
  #heroInput::placeholder{color:var(--muted);font-weight:500;}
  #heroInput:focus{border-color:var(--accent);box-shadow:0 8px 34px rgba(41,98,255,.35);}
  .hhint{color:var(--muted);font-size:12.5px;margin-top:14px;}
  .hhint b{color:var(--accent-light);font-weight:700;}

  /* 精選標的 */
  .picks{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:10px 22px 80px;}
  .picks-h{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;color:var(--text-strong);margin-bottom:4px;}
  .picks-h svg{width:17px;height:17px;color:var(--accent-light);}
  .picks-sub{color:var(--muted);font-size:12.5px;margin-bottom:18px;}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;}
  .pcard{display:block;background:rgba(30,34,45,.72);border:1px solid var(--border);border-radius:12px;padding:14px 15px;
       cursor:pointer;transition:.15s;text-decoration:none;position:relative;overflow:hidden;}
  .pcard:hover{border-color:var(--accent);transform:translateY(-3px);text-decoration:none;
       box-shadow:0 10px 26px rgba(41,98,255,.22);background:rgba(37,42,58,.9);}
  .pcard .pcode{color:var(--accent-light);font-size:19px;font-weight:800;letter-spacing:.01em;}
  .pcard .pname{color:var(--text-strong);font-size:14px;font-weight:700;margin:3px 0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pcard .pmeta{color:var(--muted);font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px;}
  .pcard .pmeta .arr{margin-left:auto;color:var(--accent-light);opacity:0;transform:translateX(-4px);transition:.15s;font-weight:800;}
  .pcard:hover .pmeta .arr{opacity:1;transform:translateX(0);}
  .landing-foot{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:12px;padding:0 22px 40px;}

  /* ══════════ 探索視圖 ══════════ */
  #explorer{display:none;}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 20px 70px;}
  .navrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .navrow a{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600;}
  .navrow a:hover{color:var(--text);text-decoration:none;}

  h2.ptitle{font-size:20px;font-weight:800;color:var(--text-strong);margin:0 0 4px;display:flex;align-items:center;gap:10px;}
  h2.ptitle .ic{width:20px;height:20px;color:var(--accent-light);}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px;}

  /* 模式分頁（視圖①／視圖②） */
  .modetabs{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;gap:4px;margin-bottom:18px;flex-wrap:wrap;}
  .mtab{background:transparent;color:var(--muted);border:none;border-radius:7px;padding:9px 16px;font-size:13.5px;font-weight:700;
       cursor:pointer;font-family:var(--font);transition:all .13s;white-space:nowrap;}
  .mtab:hover{color:var(--text);}
  .mtab.on{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(41,98,255,.35);}

  .controls{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:22px;
            display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end;}
  .ctl{display:flex;flex-direction:column;gap:6px;}
  .ctl label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.02em;}
  .ctl input,.ctl select{background:var(--bg2);color:var(--text-strong);border:1px solid var(--border);border-radius:8px;
       padding:9px 12px;font-size:15px;font-family:var(--font);font-weight:600;outline:none;transition:border-color .12s;}
  .ctl input:focus,.ctl select:focus{border-color:var(--accent);}
  #codeInput{width:190px;}
  .ctl select{width:104px;cursor:pointer;}
  .yr-sep{align-self:center;color:var(--muted);font-weight:700;padding:0 2px 8px;}
  .quick{display:flex;gap:6px;flex-wrap:wrap;}
  .quick button{background:var(--bg2);color:var(--muted);border:1px solid var(--border);border-radius:7px;
       padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .12s;}
  .quick button:hover{color:var(--text);border-color:var(--accent);}
  .quick button.on{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* 日內⇄年化 分段切換（僅視圖②） */
  .seg-wrap{display:flex;flex-direction:column;gap:6px;}
  .seg-wrap label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.02em;}
  .seg-group{display:inline-flex;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:3px;gap:3px;}
  .seg{background:transparent;color:var(--muted);border:none;border-radius:6px;padding:7px 13px;font-size:12.5px;font-weight:700;
       cursor:pointer;font-family:var(--font);transition:all .12s;white-space:nowrap;}
  .seg:hover{color:var(--text);}
  .seg.on{background:var(--accent);color:#fff;}

  #head{display:none;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  #head .code{color:var(--accent-light);font-size:26px;font-weight:800;}
  #head .name{font-size:20px;font-weight:700;color:var(--text-strong);}
  #head .badge{background:var(--accent-soft);color:var(--accent-light);border:1px solid rgba(41,98,255,.3);
       padding:3px 11px;border-radius:6px;font-size:13px;font-weight:700;}
  #rangeNote{color:var(--muted);font-size:13px;margin-bottom:16px;display:none;}
  #rangeNote b{color:var(--text);font-weight:700;}

  #cards{display:none;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px 18px;min-width:92px;text-align:center;}
  .card .l{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px;}
  .card .v{font-size:22px;font-weight:800;color:var(--text-strong);line-height:1;}
  .card .v small{font-size:12px;font-weight:600;color:var(--muted);}
  .card.hi{background:var(--accent);border-color:var(--accent);}
  .card.hi .l{color:#cdd9ff;} .card.hi .v{color:#fff;} .card.hi .v small{color:#cdd9ff;}

  #chartWrap{display:none;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px 12px;margin:14px 0 22px;}
  #chartCap{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:8px;}
  #chartCap b{color:var(--accent-light);}
  #chart{width:100%;height:300px;display:block;}
  #chart text{font-family:var(--font);}
  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted);}
  .legend .k{display:inline-flex;align-items:center;gap:6px;}
  .legend .sw{width:16px;height:3px;border-radius:2px;display:inline-block;}
  .legend .sw.dot{width:9px;height:9px;border-radius:50%;}

  #tableWrap{display:none;}
  #tableWrap h3{font-size:14px;font-weight:700;color:var(--text);margin:0 0 10px;display:flex;align-items:center;gap:8px;}
  .tscroll{overflow-x:auto;border:1px solid var(--border);border-radius:10px;max-height:520px;}
  table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap;}
  th{position:sticky;top:0;background:var(--surface2);color:var(--muted);font-weight:700;text-align:right;padding:9px 11px;border-bottom:1px solid var(--border);}
  th:first-child{text-align:left;}
  td{padding:8px 11px;text-align:right;border-bottom:1px solid var(--border);color:var(--text);}
  td:first-child{text-align:left;color:var(--muted);font-weight:600;}
  tr:hover td{background:var(--surface2);}
  td.t0col,th.t0col{background:var(--accent-soft);color:var(--accent-light);font-weight:700;}
  tr.avg td{background:var(--surface2);font-weight:800;color:var(--text-strong);border-top:2px solid var(--accent);border-bottom:none;}
  tr.avg td:first-child{color:var(--accent-light);}
  tr.cnt td{background:var(--surface2);font-size:11px;color:var(--muted);font-weight:600;padding:4px 11px;border-bottom:none;}
  td .pend{color:var(--muted);font-size:11px;font-weight:600;font-style:italic;}

  .empty{color:var(--muted);text-align:center;padding:50px 20px;font-size:15px;line-height:1.9;}
  .foot{color:var(--muted);font-size:12px;margin-top:34px;line-height:1.8;border-top:1px solid var(--border);padding-top:16px;}
</style>
</head>
<body>

<!-- ══════════ 首頁（星空） ══════════ -->
<section id="landing">
  <canvas id="stars"></canvas>
  <div class="lwrap">
    <div class="hero">
      <span class="kicker"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-5 3 3 5-7"/></svg> 法說會事件波動率</span>
      <div class="welcome">歡迎來到</div>
      <h1>【<span class="grad">法說會事件波動率探索</span>】</h1>
      <p class="lead">輸入任一檔股票，看它法說會前後（t−5 ~ t+5）每個相對日的「近 30 天（含當日）年化波動率」，或切換到當日單日波動率；皆可自選年份區間重算。</p>
      <div class="hsearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="heroInput" list="codeList" placeholder="輸入股票代號或名稱，例：2330 台積電" autocomplete="off">
      </div>

    <div class="picks-sub">點任一檔即可直接查看該股的歷史法說會波動率。</div>

  <div class="landing-foot"><a href="index.html">← 回法說會查詢網站</a></div>
</section>

<!-- ══════════ 探索視圖 ══════════ -->
<section id="explorer">
  <div class="wrap">
    <div class="navrow">
      <a href="#" onclick="showLanding();return false;"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg> 探索首頁</a>
      <a href="index.html">回法說會查詢網站</a>
    </div>

    <h2 class="ptitle">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      法說會事件波動率探索
    </h2>
    <div class="sub" id="subDesc"></div>

    <div class="modetabs" id="modetabs">
      <button class="mtab on" data-mode="roll">t−5 ~ t+5 近 30 天年化波動率</button>
      <button class="mtab" data-mode="rel">t−5 ~ t+5 單日波動率</button>

    <div class="controls">
      <div class="ctl">
        <label>股票代號</label>
        <input id="codeInput" list="codeList" placeholder="例：2330 台積電" autocomplete="off">
      </div>
      <div class="ctl">
        <label>起始年</label>
        <select id="yrFrom"></select>
      </div>
      <div class="yr-sep">~</div>
      <div class="ctl">
        <label>結束年</label>
        <select id="yrTo"></select>
      </div>
      <div class="ctl">
        <label>快速區間</label>
        <div class="quick" id="quick">
          <button data-q="all">全部</button>
          <button data-q="5">近5年</button>
          <button data-q="3">近3年</button>

          <button class="seg on" data-ann="0">日內波動率</button>
          <button class="seg" data-ann="1">年化 ×√252</button>
        </div>
      </div>
    </div>

    <div id="head">
      <span class="code" id="hCode"></span>
      <span class="name" id="hName"></span>
      <span class="badge" id="hBadge"></span>
    </div>

    <div id="cards"></div>

    <div id="chartWrap">
      <div id="chartCap"></div>
      <svg id="chart"></svg>
      <div class="legend" id="legend"></div>
    </div>

    <div id="tableWrap">
      <h3 id="tableTitle"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg> <span>逐場明細與平均</span></h3>
      <div class="tscroll"><table id="tbl"></table></div>
    </div>

    <div class="empty" id="empty" style="display:none"></div>

    <div class="foot" id="footNote"></div>
  </div>
</section>

<script>
const PRESETS = ['1303','1590','2308','2317','2327','2330','2337','2344','2408','2454','2881','3037','3189','3481','3533','3661','3711','6505','6770','7769','3653','3008'];
const OFFS_LABEL = o => o === 0 ? '法說當日' : (o > 0 ? '隔' + o + '日' : '前' + (-o) + '日');
const OFFS_SHORT = o => o === 0 ? '當日' : (o > 0 ? '+' + o : String(o));
const SQRT252 = Math.sqrt(252);
const qs = new URLSearchParams(location.search);

let DATA = null, OFFS = [], I0 = 0, PREWIN = 30;
let curCode = null;
let mode = (qs.get('view') === 'rel') ? 'rel' : 'roll';   // 'roll'=視圖①滾動年化  'rel'=視圖②單日
let ann = false;                                          // 視圖②：是否年化顯示

function yearOf(ymd){ return Math.floor(ymd / 10000); }
function fmtDate(ymd){ const s = String(ymd); return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ══════════ 星空動畫 ══════════
(function starfield(){
  const cv = document.getElementById('stars');
  const cx = cv.getContext('2d');
  let W, H, stars = [], raf = null;
  function resize(){
    W = cv.width = cv.offsetWidth * devicePixelRatio;
    H = cv.height = cv.offsetHeight * devicePixelRatio;
    const n = Math.min(200, Math.round(W * H / (13000 * devicePixelRatio)));
    stars = [];
    for(let i=0;i<n;i++) stars.push({
      x: Math.random()*W, y: Math.random()*H,
      r: (Math.random()*1.4 + 0.4) * devicePixelRatio,
      a: Math.random(), tw: Math.random()*0.02 + 0.004,
      vx: (Math.random()-0.5) * 0.12 * devicePixelRatio,
      vy: (Math.random()-0.5) * 0.12 * devicePixelRatio,
      blue: Math.random() < 0.25
    });
  }
  function tick(){
    cx.clearRect(0,0,W,H);
    for(const s of stars){
      s.a += s.tw; const al = 0.35 + Math.abs(Math.sin(s.a)) * 0.65;
      s.x += s.vx; s.y += s.vy;
      if(s.x<0) s.x+=W; if(s.x>W) s.x-=W; if(s.y<0) s.y+=H; if(s.y>H) s.y-=H;
      cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.2832);
      cx.fillStyle = s.blue ? `rgba(120,170,255,${al})` : `rgba(255,255,255,${al})`;
      if(s.r > 1.4*devicePixelRatio){ cx.shadowBlur = 6*devicePixelRatio; cx.shadowColor = s.blue?'rgba(91,156,255,.9)':'rgba(255,255,255,.8)'; }
      else cx.shadowBlur = 0;
      cx.fill();
    }
    raf = requestAnimationFrame(tick);
  }
  window.__starCtl = {
    start(){ if(!raf){ resize(); tick(); } },
    stop(){ if(raf){ cancelAnimationFrame(raf); raf = null; } }
  };
  window.addEventListener('resize', () => { if(raf) resize(); });
  window.__starCtl.start();
})();

// ══════════ 視圖切換（首頁 / 探索） ══════════
function showLanding(){
  document.getElementById('landing').style.display = 'block';
  document.getElementById('explorer').style.display = 'none';
  if(window.__starCtl) window.__starCtl.start();
  const url = new URL(location); url.searchParams.delete('code'); url.searchParams.delete('from'); url.searchParams.delete('to'); url.searchParams.delete('view');
  history.replaceState(null,'',url);
  curCode = null;
  document.getElementById('heroInput').value = '';
  window.scrollTo(0,0);
}
function showExplorer(){
  document.getElementById('landing').style.display = 'none';
  document.getElementById('explorer').style.display = 'block';
  if(window.__starCtl) window.__starCtl.stop();
  window.scrollTo(0,0);
}

// ══════════ 共用小工具 ══════════
function seriesOf(st){ return (mode === 'roll') ? (st.roll || []) : (st.ev || []); }
function unionYears(st){
  const ys = [];
  (st.ev || []).forEach(r => ys.push(yearOf(r[0])));
  (st.roll || []).forEach(r => ys.push(yearOf(r[0])));
  return [...new Set(ys)].sort((a,b)=>a-b);
}
function evCount(st){ return (st.roll && st.roll.length) || (st.ev && st.ev.length) || 0; }
function hideBlocks(){ ['cards','chartWrap','tableWrap'].forEach(id=>document.getElementById(id).style.display='none'); }
function showEmptyNote(msg){
  const rn = document.getElementById('rangeNote'); rn.style.display='block'; rn.innerHTML = msg;
  hideBlocks();
}

// 依年份區間取子集並算各相對日平均（視圖①、②共用；每列＝[ymd, v_-5..v_+5]）
// 剛開完的法說會，t+n 那幾個交易日還沒到 → 該格是 null：逐相對日各自平均、各自算分母，
// 所以 ns[i] 可能小於 n（open＝這批裡有幾場還沒滿窗）。
function averageRange(events, y0, y1){
  const sel = events.filter(r => { const y = yearOf(r[0]); return y >= y0 && y <= y1; });
  if(!sel.length) return {n:0, avg:null, ns:null, events:[], open:0};
  const sums = new Array(OFFS.length).fill(0);
  const cnts = new Array(OFFS.length).fill(0);
  let open = 0;
  sel.forEach(r => {
    let miss = 0;
    for(let i=0;i<OFFS.length;i++){
      const v = r[i+1];
      if(v == null){ miss++; continue; }
      sums[i] += v; cnts[i]++;
    }
    if(miss) open++;
  });
  return {n:sel.length, avg:sums.map((s,i) => cnts[i] ? s / cnts[i] : null),
          ns:cnts, events:sel, open:open};
}

// 把平均序列乘上單位係數（年化/日內）；null（該相對日還沒到）要保持 null，不能變 0
function scaleAvg(a, f){ return a ? a.map(v => v == null ? null : v * f) : null; }

// 未滿窗說明（接在 rangeNote 後面）
function openNote(res){
  if(!res.open) return '';
  const pend = res.events.filter(r => r.slice(1).some(v => v == null))
                         .map(r => fmtDate(r[0])).join('、');
  return `<br><span style="color:var(--muted)">其中 <b>${res.open}</b> 場尚未滿窗（${pend}）：` +
         `t+n 的交易日還沒到，已把已經發生的相對日先計入，故各相對日的平均場數不同（見表格「場數」列），交易日到齊後自動補算。</span>`;
}

function drawChart(sel, ref, ns){
  const W = 920, H = 300, padL = 46, padR = 16, padT = 22, padB = 34;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = OFFS.length;
  const xs = i => padL + innerW * (i / (n - 1));
  let lo = Infinity, hi = -Infinity;
  [sel, ref].forEach(a => { if(a) a.forEach(v => { if(v == null) return; lo = Math.min(lo, v); hi = Math.max(hi, v); }); });
  if(!isFinite(lo)){ lo = 0; hi = 1; }
  const pad = (hi - lo) * 0.15 || 0.1; lo = Math.max(0, lo - pad); hi = hi + pad;
  const span = (hi - lo) || 1;
  const ys = v => padT + innerH * (1 - (v - lo) / span);

  let grid = '', yl = '';
  const TICKS = 4;
  for(let t=0;t<=TICKS;t++){
    const val = lo + span * t / TICKS, y = ys(val).toFixed(1);
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    yl += `<text x="${padL-8}" y="${(+y+3.5).toFixed(1)}" font-size="10.5" text-anchor="end" fill="var(--muted)">${val.toFixed(2)}</text>`;
  }
  const zx = xs(I0).toFixed(1);
  grid += `<line x1="${zx}" y1="${padT}" x2="${zx}" y2="${H-padB}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4,3" opacity=".6"/>`;

  let xl = '';
  OFFS.forEach((o,i) => {
    xl += `<text x="${xs(i).toFixed(1)}" y="${H-12}" font-size="11" text-anchor="middle" fill="${o===0?'var(--accent-light)':'var(--muted)'}" font-weight="${o===0?700:500}">${OFFS_SHORT(o)}</text>`;
  });

  // 值為 null（該相對日的交易日還沒到）的點：不畫點、不標值，線也不連過去
  const pathOf = a => a.map((v,i) => [v,i]).filter(p => p[0] != null)
                       .map((p,k) => `${k===0?'M':'L'}${xs(p[1]).toFixed(1)},${ys(p[0]).toFixed(1)}`).join(' ');
  let refLine = ref ? `<path d="${pathOf(ref)}" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5,4" opacity=".55"/>` : '';
  let mainLine = `<path d="${pathOf(sel)}" fill="none" stroke="var(--accent-light)" stroke-width="2.6"/>`;
  let dots = sel.map((v,i) => {
    if(v == null) return '';
    const zero = OFFS[i] === 0;
    const nn = (ns && ns[i] != null) ? `（${ns[i]} 場平均）` : '';
    return `<circle cx="${xs(i).toFixed(1)}" cy="${ys(v).toFixed(1)}" r="${zero?5.5:3.4}" fill="${zero?'var(--accent)':'var(--accent-light)'}" stroke="var(--bg)" stroke-width="1.5"><title>${OFFS_LABEL(OFFS[i])}：${v.toFixed(2)}%${nn}</title></circle>`;
  }).join('');
  let vlab = sel.map((v,i) => v == null ? '' : `<text x="${xs(i).toFixed(1)}" y="${(ys(v)-11).toFixed(1)}" font-size="10.5" text-anchor="middle" fill="${OFFS[i]===0?'var(--accent-light)':'var(--muted)'}" font-weight="${OFFS[i]===0?700:500}">${v.toFixed(2)}</text>`).join('');

  const chart = document.getElementById('chart');
  chart.setAttribute('viewBox', `0 0 ${W} ${H}`);
  chart.innerHTML = grid + yl + xl + refLine + mainLine + dots + vlab +
    `<text x="${padL-8}" y="${padT-8}" font-size="10.5" text-anchor="end" fill="var(--muted)">%</text>`;
}

function keyCards(avg){
  const cell = (lbl, o, hi) => {
    const i = OFFS.indexOf(o);
    const v = i >= 0 ? avg[i] : null;
    return `<div class="card${hi?' hi':''}"><div class="l">${lbl}</div><div class="v">${v==null?'<small>—</small>':v.toFixed(2)+'<small>%</small>'}</div></div>`;
  };
  return cell('前2日',-2) + cell('前1日',-1) + cell('法說當日',0,true) + cell('隔1日',1);
}

function dataTable(res, f){
  let th = '<tr><th>法說日</th>';
  OFFS.forEach(o => th += `<th class="${o===0?'t0col':''}">${OFFS_SHORT(o)}</th>`);
  th += '</tr>';
  let avgTr = '<tr class="avg"><td>平均（' + res.n + ' 場）</td>';
  res.avg.forEach((v,i) => avgTr += `<td class="${OFFS[i]===0?'t0col':''}">${v==null?'—':(v*f).toFixed(2)}</td>`);
  avgTr += '</tr>';
  // 有場次還沒滿窗 → 各相對日的分母不同，多一列標出每個相對日實際平均了幾場
  let cntTr = '';
  if(res.ns && res.ns.some(c => c !== res.n)){
    cntTr = '<tr class="cnt"><td>場數</td>' +
      res.ns.map((c,i) => `<td class="${OFFS[i]===0?'t0col':''}">${c}</td>`).join('') + '</tr>';
  }
  let rows = '';
  res.events.forEach(r => {
    rows += '<tr><td>' + fmtDate(r[0]) + '</td>';
    for(let i=0;i<OFFS.length;i++){
      const v = r[i+1];
      rows += `<td class="${OFFS[i]===0?'t0col':''}">${v==null?'<span class="pend">未到</span>':(v*f).toFixed(2)}</td>`;
    }
    rows += '</tr>';
  });
  document.getElementById('tbl').innerHTML = th + avgTr + cntTr + rows;
}

// ══════════ 視圖① 滾動 PREWIN 天年化波動率（t−5 ~ t+5 各相對日） ══════════
function renderRoll(st){
  const evs = st.roll || [];
  if(!evs.length){ showEmptyNote(`此檔沒有 t−5 ~ t+5 的滾動年化資料（每個相對日都要「含當日往回 ${PREWIN} 個交易日」的行情齊全）。可切換到「單日波動率」檢視。`); return; }
  const y0 = +document.getElementById('yrFrom').value;
  const y1 = +document.getElementById('yrTo').value;
  const lo = Math.min(y0,y1), hi = Math.max(y0,y1);
  const res = averageRange(evs, lo, hi);
  const full = averageRange(evs, 0, 9999);

  document.getElementById('hBadge').textContent = '共 ' + full.n + ' 場（' + yearOf(evs[evs.length-1][0]) + '–' + yearOf(evs[0][0]) + '）';
  const rn = document.getElementById('rangeNote'); rn.style.display = 'block';
  if(res.n === 0){ showEmptyNote(`<b>${lo}–${hi}</b> 年間查無符合窗口的法說會場次。`); return; }
  rn.innerHTML = `目前顯示 <b>${lo}–${hi}</b> 年、共 <b>${res.n}</b> 場法說會，每個相對日為「近 ${PREWIN} 天（含當日）滾動年化波動率」的平均${res.n<full.n?`（全部年份 ${full.n} 場，見圖中灰色參考線）`:'（＝全部年份）'}。` + openNote(res);

  document.getElementById('cards').style.display = 'flex';
  document.getElementById('cards').innerHTML = keyCards(res.avg);
  document.getElementById('chartWrap').style.display = 'block';
  document.getElementById('chartCap').innerHTML = `法說會前後每個相對日「近 ${PREWIN} 天（含當日）滾動<b>年化</b>波動率」（%）跨場平均；t0 為法說當日（虛線）。因窗口 ${PREWIN} 天、t−5~t+5 僅差 10 天，曲線通常平緩，重點看斜率（事件逼近時波動率累積或消退）。`;
  drawChart(res.avg, res.n < full.n ? full.avg : null, res.ns);
  document.getElementById('legend').innerHTML =
    `<span class="k"><span class="sw" style="background:var(--accent-light)"></span>選定區間平均</span>` +
    `<span class="k"><span class="sw" style="background:var(--muted);opacity:.6"></span>全部年份平均（參考）</span>` +
    `<span class="k"><span class="sw dot" style="background:var(--accent)"></span>法說當日</span>`;
  document.getElementById('tableWrap').style.display = 'block';
  document.querySelector('#tableTitle span').textContent = `逐場明細（近 ${PREWIN} 天（含當日）滾動年化波動率）`;
  dataTable(res, 1);
}

// ══════════ 視圖② 單日波動率（t−5 ~ t+5，可年化） ══════════
function renderRel(st){
  const evs = st.ev || [];
  if(!evs.length){ showEmptyNote(`此檔沒有可用的 t−5 ~ t+5 單日波動率場次（法說當日與前 5 個交易日行情要齊全；t+n 還沒到的場次會照納入、缺的相對日標「未到」）。可切換到「滾動年化波動率」檢視。`); return; }
  const y0 = +document.getElementById('yrFrom').value;
  const y1 = +document.getElementById('yrTo').value;
  const lo = Math.min(y0,y1), hi = Math.max(y0,y1);
  const res = averageRange(evs, lo, hi);
  const full = averageRange(evs, 0, 9999);
  const f = ann ? SQRT252 : 1;

  document.getElementById('hBadge').textContent = '共 ' + full.n + ' 場（' + yearOf(evs[evs.length-1][0]) + '–' + yearOf(evs[0][0]) + '）';
  const rn = document.getElementById('rangeNote'); rn.style.display = 'block';
  if(res.n === 0){ showEmptyNote(`<b>${lo}–${hi}</b> 年間查無符合窗口的法說會場次。`); return; }
  const unit = ann ? '年化波動率' : '日內波動率';
  rn.innerHTML = `目前顯示 <b>${lo}–${hi}</b> 年、共 <b>${res.n}</b> 場法說會的平均${res.n<full.n?`（全部年份 ${full.n} 場，見圖中灰色參考線）`:'（＝全部年份）'}；單位：<b>${unit}</b>。` + openNote(res);

  document.getElementById('cards').style.display = 'flex';
  document.getElementById('cards').innerHTML = keyCards(scaleAvg(res.avg, f));
  document.getElementById('chartWrap').style.display = 'block';
  document.getElementById('chartCap').innerHTML = `法說會前後每個相對日的平均<b>${unit}</b>（%）；t0 為法說當日（虛線）。單日波動率反映當天的波動尖峰。`;
  drawChart(scaleAvg(res.avg, f), res.n < full.n ? scaleAvg(full.avg, f) : null, res.ns);
  document.getElementById('legend').innerHTML =
    `<span class="k"><span class="sw" style="background:var(--accent-light)"></span>選定區間平均</span>` +
    `<span class="k"><span class="sw" style="background:var(--muted);opacity:.6"></span>全部年份平均（參考）</span>` +
    `<span class="k"><span class="sw dot" style="background:var(--accent)"></span>法說當日</span>`;
  document.getElementById('tableWrap').style.display = 'block';
  document.querySelector('#tableTitle span').textContent = '逐場明細與平均（' + unit + '）';
  dataTable(res, f);
}

// ══════════ 主渲染分派 ══════════
function updateModeUI(){
  document.querySelectorAll('#modetabs .mtab').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  document.getElementById('annToggle').style.display = (mode === 'rel') ? 'flex' : 'none';
  document.querySelectorAll('#annToggle .seg').forEach(b => b.classList.toggle('on', (+b.dataset.ann === 1) === ann));
  document.getElementById('subDesc').innerHTML = (mode === 'roll')
    ? `法說會前後（t−5 ~ 當日 ~ t+5）每個相對日的「近 ${PREWIN} 天（含當日）滾動年化波動率」跨場平均，看事件逼近時的波動水位走勢。Parkinson 高低價估計 ×√252 年化。`
    : `法說會前後（t−5 ~ 當日 ~ t+5）每個相對日的平均「單日」波動率，看事件當天的波動尖峰；右側可切「日內／年化」單位。`;
}

function render(){
  const st = DATA.stocks[curCode];
  if(!st) return;
  document.getElementById('head').style.display = 'flex';
  document.getElementById('hCode').textContent = curCode;
  document.getElementById('hName').textContent = st.name || '';
  document.getElementById('empty').style.display = 'none';
  updateModeUI();
  if(mode === 'roll') renderRoll(st); else renderRel(st);
}

function fillYears(st){
  const yrs = unionYears(st);
  const from = document.getElementById('yrFrom'), to = document.getElementById('yrTo');
  from.innerHTML = yrs.map(y => `<option value="${y}">${y}</option>`).join('');
  to.innerHTML   = yrs.map(y => `<option value="${y}">${y}</option>`).join('');
  from.value = yrs[0];
  to.value = yrs[yrs.length-1];
}

let pendingYears = {from: parseInt(qs.get('from'),10), to: parseInt(qs.get('to'),10)};
function applyYearParams(st){
  const yrs = unionYears(st);
  const minY = yrs[0], maxY = yrs[yrs.length-1];
  const clamp = v => Math.max(minY, Math.min(maxY, v));
  if(!isNaN(pendingYears.from)) document.getElementById('yrFrom').value = clamp(pendingYears.from);
  if(!isNaN(pendingYears.to))   document.getElementById('yrTo').value = clamp(pendingYears.to);
  pendingYears = {from:NaN, to:NaN};
}

function selectCode(code){
  code = String(code||'').trim();
  const st = DATA.stocks[code];
  if(!st){
    showExplorer();
    ['head','rangeNote','cards','chartWrap','tableWrap'].forEach(id=>document.getElementById(id).style.display='none');
    const e = document.getElementById('empty'); e.style.display = 'block';
    e.textContent = code ? `查無代號「${code}」的法說會波動率資料。` : '請輸入股票代號。';
    document.getElementById('codeInput').value = code;
    return;
  }
  curCode = code;
  showExplorer();
  document.getElementById('codeInput').value = code + (st.name ? ' ' + st.name : '');
  fillYears(st);
  applyYearParams(st);
  setQuickActive(null);
  render();
  const url = new URL(location); url.searchParams.set('code', code); url.searchParams.set('view', mode); history.replaceState(null,'',url);
}

function setQuickActive(q){
  document.querySelectorAll('#quick button').forEach(b => b.classList.toggle('on', b.dataset.q === q));
}

// 模式分頁
document.getElementById('modetabs').addEventListener('click', e => {
  const b = e.target.closest('.mtab'); if(!b) return;
  mode = b.dataset.mode;
  const url = new URL(location); url.searchParams.set('view', mode); history.replaceState(null,'',url);
  if(curCode) render(); else updateModeUI();
});

// 日內⇄年化（僅視圖②）
document.getElementById('annToggle').addEventListener('click', e => {
  const b = e.target.closest('.seg'); if(!b) return;
  ann = (+b.dataset.ann === 1);
  if(curCode) render(); else updateModeUI();
});

document.getElementById('quick').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || !curCode) return;
  const st = DATA.stocks[curCode];
  const yrs = unionYears(st);
  const maxY = yrs[yrs.length-1], minY = yrs[0];
  const from = document.getElementById('yrFrom'), to = document.getElementById('yrTo');
  if(b.dataset.q === 'all'){ from.value = minY; to.value = maxY; }
  else { const span = +b.dataset.q; from.value = Math.max(minY, maxY - span + 1); to.value = maxY; }
  setQuickActive(b.dataset.q);
  render();
});

['yrFrom','yrTo'].forEach(id => document.getElementById(id).addEventListener('change', () => { setQuickActive(null); render(); }));

function wireSearch(inputId){
  const el = document.getElementById(inputId);
  const go = () => { const c = el.value.trim().split(/\s+/)[0]; if(c) selectCode(c); };
  el.addEventListener('change', go);
  el.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
}
wireSearch('heroInput');
wireSearch('codeInput');

function buildPresets(){
  const grid = document.getElementById('pgrid');
  grid.innerHTML = PRESETS.map(c => {
    const st = DATA.stocks[c];
    if(!st) return '';
    return `<a class="pcard" href="vol_explorer.html?code=${c}" onclick="event.preventDefault();selectCode('${c}');">`
      + `<div class="pcode">${c}</div>`
      + `<div class="pname">${esc(st.name)}</div>`
      + `<div class="pmeta">${evCount(st)} 場法說<span class="arr">→</span></div></a>`;
  }).join('');
}

fetch('vol_events.json', {cache:'no-store'})
  .then(r => { if(!r.ok) throw new Error('vol_events.json 讀取失敗'); return r.json(); })
  .then(d => {
    DATA = d; OFFS = d.offsets; I0 = OFFS.indexOf(0); PREWIN = d.roll_window || 30;
    document.getElementById('footNote').innerHTML =
      `資料由 compute_vol_stats.py 產生 vol_events.json（逐場 Parkinson 波動率）。<br>`
      + `視圖①「近 ${PREWIN} 天年化波動率」：t−5 ~ t+5 每個相對日各取「含當日往回 ${PREWIN} 個交易日」的 Parkinson 日內波動率平均、×√252 年化，跨場平均。<br>`
      + `視圖②「單日波動率」：每個相對日的當日 Parkinson 波動率，可切日內／年化單位。兩視圖皆需 11 個相對日行情齊全的場次才計入；行情涵蓋 2015 年起。與法說會查詢網站分開維護。`;
    document.getElementById('codeList').innerHTML =
      Object.entries(d.stocks).sort((a,b)=>a[0].localeCompare(b[0]))
        .map(([c,v]) => `<option value="${c}">${c} ${v.name}</option>`).join('');
    buildPresets();
    updateModeUI();
    const initial = qs.get('code');
    if(initial){ selectCode(initial); }   // 深連結直接進探索視圖
  })
  .catch(err => {
    document.getElementById('pgrid').innerHTML =
      `<div class="empty" style="grid-column:1/-1">無法載入 vol_events.json（${esc(err.message)}）。<br>請確認已跑過 compute_vol_stats.py，且此頁是透過 http / GitHub Pages 開啟（非本機 file://）。</div>`;
  });
</script>
