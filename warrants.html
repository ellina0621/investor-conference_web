<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>可買權證篩選（全市場快照）</title>
<style>
  :root{
    --bg:#131722; --bg2:#0e1117; --surface:#1e222d; --surface2:#242833;
    --border:#2a2e39; --text:#d1d4dc; --text-strong:#f0f3fa; --muted:#787b86;
    --accent:#2962ff; --warrant:#e0a44d; --call:#ef5350; --put:#26a69a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;font-size:14px;}
  a{color:var(--accent);text-decoration:none;} a:hover{text-decoration:underline;}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px;}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .top .code{color:var(--accent);font-size:26px;font-weight:800;}
  .top .name{font-size:20px;font-weight:700;color:var(--text-strong);}
  .top .tag{background:rgba(255,152,0,.14);color:var(--warrant);border:1px solid rgba(255,152,0,.3);
            padding:3px 10px;border-radius:6px;font-size:13px;font-weight:700;}
  .meta{font-size:12px;color:var(--muted);line-height:1.7;margin:8px 0 18px;}
  .meta b{color:var(--text);} .meta .sep{margin:0 4px;color:var(--border);}
  .links a{margin-right:14px;font-weight:700;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{position:sticky;top:0;background:var(--surface2);color:var(--muted);font-weight:700;
     text-align:right;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:default;}
  th:nth-child(1),th:nth-child(2),th:nth-child(3){text-align:left;}
  td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.05);color:var(--text);}
  td.r{text-align:right;font-variant-numeric:tabular-nums;}
  td.hi{color:#ffb74d;font-weight:800;background:rgba(255,152,0,.07);}
  td small{color:var(--muted);font-weight:500;}
  tbody tr:hover{background:var(--surface);}
  .id b{color:var(--text-strong);font-weight:700;} .id .nm{font-size:11px;color:var(--muted);}
  .type{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap;}
  td:nth-child(2){white-space:nowrap;}
  .type.call{background:rgba(229,57,53,.16);color:var(--call);}
  .type.put{background:rgba(38,166,154,.16);color:var(--put);}
  .tk{padding:0 5px;border-radius:4px;font-size:11px;font-weight:700;cursor:help;}
  .tk.ok{background:rgba(38,166,154,.18);color:#26a69a;}
  .tk.mid{background:rgba(255,152,0,.16);color:#e0a44d;}
  .tk.bad{background:rgba(229,57,53,.16);color:#ef5350;}
  .ivwatch{cursor:help;border-bottom:1px dotted var(--border);}
  .ivwatch .sl2{color:var(--muted);margin:0 2px;}
  .up{color:var(--call);font-weight:700;} .dn{color:var(--put);font-weight:700;}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:15px;}
  .cards{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;
        padding:12px 16px;min-width:150px;transition:border-color .12s;}
  .card:hover{border-color:var(--accent);}
  .card .c{color:var(--accent);font-weight:800;font-size:16px;}
  .card .n{color:var(--text-strong);font-weight:600;} .card .k{color:var(--muted);font-size:12px;margin-top:4px;}
  .back{font-size:13px;} .foot{margin-top:22px;font-size:11px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">載入中…</div></div>
<script>
const LIVE   = c => `https://www.warrantwin.com.tw/eyuanta/Warrant/Search.aspx?SID=${encodeURIComponent(c)}`;
const SMART  = c => `https://www.warrantwin.com.tw/eyuanta/Warrant/SmartSearch.aspx?SID=${encodeURIComponent(c)}`;
const qs = new URLSearchParams(location.search);
const CODE = (qs.get('code')||'').trim();

function num(s,suf){ s=String(s==null?'':s).trim(); if(s==='') return '—';
  const n=Number(s); return (isFinite(n)?(Math.round(n*100)/100):s)+(suf||''); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function iv1(x){ x=String(x==null?'':x).trim(); if(x===''||x==='0'||x==='0.00') return '—'; const n=Number(x); return isFinite(n)?n.toFixed(1):x; }

// 買/賣隱波 + 相對上一次觀測的變動（抓發行商偷調隱波），tooltip 顯示歷史
function ivCell(w){
  const cur = `${iv1(w.ivb)}<span class="sl2">/</span>${iv1(w.ivs)}`;
  const h = Array.isArray(w.ivh)? w.ivh : [];
  let arrow='';
  if(h.length>=2){
    const a=h[h.length-1][1], b=h[h.length-2][1];   // 買IV 最近兩個變動點
    if(a!=null && b!=null){ const d=Math.round((a-b)*100)/100;
      if(d>0) arrow=` <span class="up">▲${d}</span>`; else if(d<0) arrow=` <span class="dn">▼${Math.abs(d)}</span>`; }
  }
  const title = h.length
    ? '買/賣隱波變動紀錄（僅記錄有變動時）：\n' + h.map(o=>`${o[0]}　買 ${o[1]==null?'—':o[1]} / 賣 ${o[2]==null?'—':o[2]}`).join('\n')
    : '尚無歷史（多跑幾天累積後可看調整軌跡）';
  return `<span class="ivwatch" title="${esc(title)}">${cur}${arrow}</span>`;
}

function renderStock(data, code){
  const picks = (data.picks||{})[code] || [];
  const uname = picks.length ? (picks[0].u||'') : '';
  const asOf = data.as_of || '—';
  const head = `
    <div class="top">
      <span class="code">${esc(code)}</span>
      <span class="name">${esc(uname)}</span>
      <span class="tag">可買權證（挑過）</span>
    </div>
    <div class="meta">
      全市場・嚴格門檻（當天有成交量<span class="sep">・</span>買賣價差比≤3%<span class="sep">・</span>|價內外|≤20%<span class="sep">・</span>剩餘90~180天）
      依 <b>差槓比</b> 由小到大排（越小越划算）　資料時間：<b>${esc(asOf)}</b><br>
      <span class="links"><a href="${LIVE(code)}" target="_blank" rel="noopener">全部發行商即時 →</a>
      <a href="${SMART(code)}" target="_blank" rel="noopener">元大智慧選即時 →</a>
      <a class="back" href="warrants.html">← 所有標的</a></span>
    </div>`;
  if(!picks.length){
    document.getElementById('app').innerHTML = head +
      `<div class="empty">此門檻下無合格權證（可能沒有當天成交量、或都不符篩選條件）。<br>
       點上方「全部發行商即時」看 warrantwin 完整清單。</div>`;
    document.title = `${code} ${uname}｜可買權證`;
    return;
  }
  // 直接對照：標的每動 1 tick 權證漲多少 vs 當天 theta 損耗 → 包不包得過
  const fx = x => (x==null||x==='') ? '—' : x;
  const tdCell = w => {
    if(w.gpt==null || w.thabs==null) return '—';
    const isCall = String(w.typ||'').includes('購');
    const dir = isCall ? '漲' : '跌';   // 認售需標的「跌」才對持有者有利
    const cover = (w.net!=null && w.net>=0);
    const pill = w.net==null ? '' : (cover
      ? `<span class="tk ok">✓ 剩 +${fx(w.net)}</span>`
      : `<span class="tk bad">✗ 缺 ${fx(Math.abs(w.net))}</span>`);
    const tip = `標的每${dir} 1 tick（${fx(w.tk)} 元），權證 +${fx(w.gpt)} 元　vs　當天 theta −${fx(w.thabs)} 元　→ `
      + (cover ? `包得過（還剩 +${fx(w.net)}）` : `包不過（還差 ${fx(Math.abs(w.net))}）`)
      + `　｜換算：需標的${dir} ${fx(w.td)} 元 = ${fx(w.tkn)} 檔`;
    return `<span class="ivwatch" title="${esc(tip)}">每tick <b>+${fx(w.gpt)}</b><span class="sl2">vs</span>θ <b>−${fx(w.thabs)}</b></span> ${pill}`;
  };
  const rows = picks.map(w=>{
    const isCall = String(w.typ||'').includes('購');
    return `<tr>
      <td class="id"><b>${esc(w.id)}</b><div class="nm">${esc(w.nm)}</div></td>
      <td><span class="type ${isCall?'call':'put'}">${esc(w.typ)}</span></td>
      <td>${esc(w.iss)}</td>
      <td class="r">${num(w.px)}</td>
      <td class="r">${num(w.vol)}</td>
      <td class="r">${num(w.spr,'%')}</td>
      <td class="r">${num(w.lev)}</td>
      <td class="r hi">${num(w.sl)}</td>
      <td class="r">${esc(w.io)||'—'}</td>
      <td class="r">${tdCell(w)}</td>
      <td class="r">${num(w.per,' 天')}</td>
      <td class="r">${ivCell(w)}</td>
    </tr>`;
  }).join('');
  document.getElementById('app').innerHTML = head + `
    <table>
      <thead><tr>
        <th>權證</th><th>類型</th><th>發行商</th><th>成交價</th><th>成交量</th>
        <th>買賣價差比</th><th>槓桿</th><th title="買賣價差比÷實質槓桿，越小越划算">差槓比 ▾</th>
        <th>價內外</th><th title="標的每動1個tick權證漲多少(|delta|×tick) 對照 當天theta損耗；✓包過=前者≥後者。滑鼠移上看完整算式">1tick vs theta</th>
        <th>剩餘</th><th title="發行商掛的買進/賣出隱波；箭頭為相對上次觀測變動。滑鼠移上看歷史，抓偷調隱波">隱波 買/賣</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="foot">差槓比 = 買賣價差比 ÷ 實質槓桿（越小＝用越低的價差成本換到越高槓桿）；本表<b>依差槓比由小到大排</b>、不設槓桿硬門檻。
    「1tick vs theta」= 標的每動 1 個 tick 權證漲多少（|delta|×tick，delta 已含行使比例）對照 當天 theta 損耗（|theta|）：
    <span class="tk ok">✓ 剩</span> 代表標的往有利方向動一檔就<b>包得過</b>當天時間價值損耗、<span class="tk bad">✗ 缺</span> 代表還差多少（認購看漲、認售看跌）。滑鼠移上看完整算式與檔數換算。
    隱波「買/賣」= 發行商掛的買進/賣出隱含波動率；▲▼ 為買進隱波相對上次觀測的變動，滑鼠移上顯示歷次變動紀錄（抓發行商偷調隱波）。每天跑會累積軌跡。</div>`;
  document.title = `${code} ${uname}｜可買權證（${picks.length}）`;
}

function renderLanding(data){
  const picks = data.picks || {};
  const codes = Object.keys(picks);
  const asOf = data.as_of || '—';
  const cards = codes.map(c=>{
    const p=picks[c]; const uname=p.length?(p[0].u||''):'';
    return `<a class="card" href="warrants.html?code=${encodeURIComponent(c)}">
      <div class="c">${esc(c)}</div><div class="n">${esc(uname)}</div>
      <div class="k">${p.length} 檔挑過的權證</div></a>`;
  }).join('');
  document.getElementById('app').innerHTML = `
    <div class="top"><span class="name">可買權證篩選</span><span class="tag">全市場快照</span></div>
    <div class="meta">即將法說標的中、通過嚴格門檻的可買權證。資料時間：<b>${esc(asOf)}</b></div>
    ${codes.length? `<div class="cards">${cards}</div>` :
      `<div class="empty">目前沒有任何標的通過門檻。</div>`}
    <div class="foot">此頁與法說會網站分開維護：資料由 warrant_screener.py 產生 warrant_picks.json，本頁執行時讀取。</div>`;
  document.title = '可買權證篩選（全市場快照）';
}

fetch('warrant_picks.json', {cache:'no-store'})
  .then(r => { if(!r.ok) throw new Error('warrant_picks.json 讀取失敗'); return r.json(); })
  .then(data => { if(CODE) renderStock(data, CODE); else renderLanding(data); })
  .catch(err => {
    document.getElementById('app').innerHTML =
      `<div class="empty">無法載入 warrant_picks.json（${esc(err.message)}）。<br>
       請確認已跑過 warrant_screener.py，且此頁是透過 http/GitHub Pages 開啟（非本機 file://）。
       ${CODE?`<br><br><a href="${LIVE(CODE)}" target="_blank" rel="noopener">直接到 warrantwin 看 ${esc(CODE)} 即時 →</a>`:''}</div>`;
  });
</script>
</body>
</html>
