<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>可買權證篩選（全市場快照）</title>
<style>
  :root{
    --bg:#131722; --bg2:#0e1117; --surface:#1e222d; --surface2:#242833;
    --border:#2a2e39; --text:#d1d4dc; --text-strong:#f0f3fa; --muted:#787b86;
    --accent:#2962ff; --warrant:#e0a44d; --call:#ef5350; --put:#26a69a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;font-size:14px;}
  a{color:var(--accent);text-decoration:none;} a:hover{text-decoration:underline;}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px;}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .top .code{color:var(--accent);font-size:26px;font-weight:800;}
  .top .name{font-size:20px;font-weight:700;color:var(--text-strong);}
  .top .tag{background:rgba(255,152,0,.14);color:var(--warrant);border:1px solid rgba(255,152,0,.3);
            padding:3px 10px;border-radius:6px;font-size:13px;font-weight:700;}
  .meta{font-size:12px;color:var(--muted);line-height:1.7;margin:8px 0 18px;}
  .meta b{color:var(--text);} .meta .sep{margin:0 4px;color:var(--border);}
  .links a{margin-right:14px;font-weight:700;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{position:sticky;top:0;background:var(--surface2);color:var(--muted);font-weight:700;
     text-align:right;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  th:nth-child(1),th:nth-child(2),th:nth-child(3){text-align:left;}
  #wtable th{cursor:pointer;user-select:none;transition:color .1s;}
  #wtable th:hover{color:var(--text);}
  #wtable th.sorted{color:var(--text-strong);}
  .sarrow{color:var(--accent);font-weight:800;}
  td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.05);color:var(--text);}
  td.r{text-align:right;font-variant-numeric:tabular-nums;}
  td.hi{color:#ffb74d;font-weight:800;background:rgba(255,152,0,.07);}
  td small{color:var(--muted);font-weight:500;}
  tbody tr:hover{background:var(--surface);}
  .id b{color:var(--text-strong);font-weight:700;} .id .nm{font-size:11px;color:var(--muted);}
  .type{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap;}
  td:nth-child(2){white-space:nowrap;}
  .type.call{background:rgba(229,57,53,.16);color:var(--call);}
  .type.put{background:rgba(38,166,154,.16);color:var(--put);}
  .tk{padding:0 5px;border-radius:4px;font-size:11px;font-weight:700;cursor:help;}
  .tk.ok{background:rgba(38,166,154,.18);color:#26a69a;}
  .tk.mid{background:rgba(255,152,0,.16);color:#e0a44d;}
  .tk.bad{background:rgba(229,57,53,.16);color:#ef5350;}
  .wrow{cursor:pointer;} .wrow:hover{background:var(--surface);}
  .wrow .caret{display:inline-block;color:var(--muted);font-size:10px;margin-right:5px;transition:transform .15s;}
  .wrow.open .caret{transform:rotate(90deg);color:var(--accent);}
  .wrow.open{background:var(--surface2);}
  .drow > td{padding:0;border-bottom:1px solid var(--border);background:var(--bg2);}
  .qd{padding:14px 18px;}
  .qd-head{font-size:12.5px;color:var(--muted);margin-bottom:12px;}
  .qd-head b{color:var(--text-strong);font-size:14px;}
  .qd-ok{color:var(--put);font-weight:700;margin-left:6px;}
  .qd-warn{color:#ef5350;font-weight:700;margin-left:6px;}
  .qd-none{padding:16px 18px;color:var(--muted);font-size:13px;}
  .qd-bars{display:flex;gap:14px;align-items:flex-end;height:130px;}
  .qd-bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:56px;}
  .qd-track{width:26px;height:80px;display:flex;align-items:flex-end;background:rgba(255,255,255,.04);border-radius:3px;}
  .qd-fill{width:100%;background:var(--accent);border-radius:3px 3px 0 0;}
  .qd-fill.z{background:#ef5350;}
  .qd-v{font-size:12px;font-weight:700;color:var(--text);margin-top:5px;} .qd-v.z{color:#ef5350;}
  .qd-d{font-size:11px;color:var(--muted);margin-top:2px;}
  .ivwatch{cursor:help;border-bottom:1px dotted var(--border);}
  .ivwatch .sl2{color:var(--muted);margin:0 2px;}
  .up{color:var(--call);font-weight:700;} .dn{color:var(--put);font-weight:700;}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:15px;}
  .cards{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;
        padding:12px 16px;min-width:150px;transition:border-color .12s;}
  .card:hover{border-color:var(--accent);}
  .card .c{color:var(--accent);font-weight:800;font-size:16px;}
  .card .n{color:var(--text-strong);font-weight:600;} .card .k{color:var(--muted);font-size:12px;margin-top:4px;}
  .back{font-size:13px;} .foot{margin-top:22px;font-size:11px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">載入中…</div></div>
<script>
const LIVE   = c => `https://www.warrantwin.com.tw/eyuanta/Warrant/Search.aspx?SID=${encodeURIComponent(c)}`;
const SMART  = c => `https://www.warrantwin.com.tw/eyuanta/Warrant/SmartSearch.aspx?SID=${encodeURIComponent(c)}`;
const qs = new URLSearchParams(location.search);
const CODE = (qs.get('code')||'').trim();

function num(s,suf){ s=String(s==null?'':s).trim(); if(s==='') return '—';
  const n=Number(s); return (isFinite(n)?(Math.round(n*100)/100):s)+(suf||''); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function iv1(x){ x=String(x==null?'':x).trim(); if(x===''||x==='0'||x==='0.00') return '—'; const n=Number(x); return isFinite(n)?n.toFixed(1):x; }

// 買/賣隱波 + 相對上一次觀測的變動（抓發行商偷調隱波），tooltip 顯示歷史
function ivCell(w){
  const cur = `${iv1(w.ivb)}<span class="sl2">/</span>${iv1(w.ivs)}`;
  const h = Array.isArray(w.ivh)? w.ivh : [];
  let arrow='';
  if(h.length>=2){
    const a=h[h.length-1][1], b=h[h.length-2][1];   // 買IV 最近兩個變動點
    if(a!=null && b!=null){ const d=Math.round((a-b)*100)/100;
      if(d>0) arrow=` <span class="up">▲${d}</span>`; else if(d<0) arrow=` <span class="dn">▼${Math.abs(d)}</span>`; }
  }
  const title = h.length
    ? '買/賣隱波變動紀錄（僅記錄有變動時）：\n' + h.map(o=>`${o[0]}　買 ${o[1]==null?'—':o[1]} / 賣 ${o[2]==null?'—':o[2]}`).join('\n')
    : '尚無歷史（多跑幾天累積後可看調整軌跡）';
  return `<span class="ivwatch" title="${esc(title)}">${cur}${arrow}</span>`;
}

// 點開的明細：近5交易日成交量（張）長條 + 平均 + 沒交易日
function detailCell(w){
  const q = w.q;
  if(!q) return `<div class="qd-none">無 TWSE 上市量能資料（此權證多為上櫃 7 開頭，請點上方「全部發行商即時」查）</div>`;
  const max = Math.max.apply(null, q.l.concat([1]));
  const bars = q.d.map((dt,i)=>{
    const v = q.l[i], zero = (v===0);
    const h = zero ? 3 : Math.max(6, Math.round(v/max*100));
    return `<div class="qd-bar" title="${esc(dt)}：${zero?'完全沒交易':v+' 張'}">
      <div class="qd-track"><div class="qd-fill${zero?' z':''}" style="height:${h}%"></div></div>
      <div class="qd-v${zero?' z':''}">${zero?'0':v}</div><div class="qd-d">${esc(dt)}</div></div>`;
  }).join('');
  const zt = q.z.length
    ? `<span class="qd-warn">近5日有 ${q.z.length} 天完全沒交易：${q.z.join('、')}</span>`
    : `<span class="qd-ok">近5日天天有量 ✓</span>`;
  return `<div class="qd">
    <div class="qd-head">近5交易日成交量（張）　平均 <b>${q.avg}</b> 張/日　有量 ${q.td}/5 天　${zt}</div>
    <div class="qd-bars">${bars}</div></div>`;
}
function toggleDetail(tr){
  const d = tr.nextElementSibling;
  if(!d || !d.classList.contains('drow')) return;
  const open = d.style.display==='none' || !d.style.display;
  d.style.display = open ? 'table-row' : 'none';
  tr.classList.toggle('open', open);
}

// ── 表格排序 ──────────────────────────────────────────────
const fx = x => (x==null||x==='') ? '—' : x;
function _n(s){ s=String(s==null?'':s).trim().replace(/,/g,''); if(s==='') return null;
  const buf=[]; for(const c of s){ if((c>='0'&&c<='9')||c==='.'||c==='-') buf.push(c); else if(buf.length) break; }
  const v=parseFloat(buf.join('')); return isFinite(v)?v:null; }
function tdCell(w){
  if(w.gpt==null || w.thabs==null) return '—';
  const isCall = String(w.typ||'').includes('購');
  const dir = isCall ? '漲' : '跌';   // 認售需標的「跌」才對持有者有利
  const cover = (w.net!=null && w.net>=0);
  const pill = w.net==null ? '' : (cover
    ? `<span class="tk ok">✓ 剩 +${fx(w.net)}</span>`
    : `<span class="tk bad">✗ 缺 ${fx(Math.abs(w.net))}</span>`);
  const tip = `標的每${dir} 1 tick（${fx(w.tk)} 元），權證 +${fx(w.gpt)} 元　vs　當天 theta −${fx(w.thabs)} 元　→ `
    + (cover ? `包得過（還剩 +${fx(w.net)}）` : `包不過（還差 ${fx(Math.abs(w.net))}）`)
    + `　｜換算：需標的${dir} ${fx(w.td)} 元 = ${fx(w.tkn)} 檔`;
  return `<span class="ivwatch" title="${esc(tip)}">每tick <b>+${fx(w.gpt)}</b><span class="sl2">vs</span>θ <b>−${fx(w.thabs)}</b></span> ${pill}`;
}
function rowHtml(w){
  const isCall = String(w.typ||'').includes('購');
  return `<tr class="wrow" onclick="toggleDetail(this)" title="點我看近5交易日成交量明細">
      <td class="id"><span class="caret">▸</span><b>${esc(w.id)}</b><div class="nm">${esc(w.nm)}</div></td>
      <td><span class="type ${isCall?'call':'put'}">${esc(w.typ)}</span></td>
      <td>${esc(w.iss)}</td>
      <td class="r">${num(w.px)}</td>
      <td class="r">${num(w.vol)}</td>
      <td class="r">${num(w.spr,'%')}</td>
      <td class="r">${num(w.lev)}</td>
      <td class="r">${fx(w.de)}</td>
      <td class="r">${fx(w.conv)}</td>
      <td class="r">${(w.ovr==null||w.ovr==='')?'—':num(w.ovr,'%')}</td>
      <td class="r hi">${num(w.sl)}</td>
      <td class="r">${esc(w.io)||'—'}</td>
      <td class="r">${tdCell(w)}</td>
      <td class="r">${num(w.per,' 天')}</td>
      <td class="r">${ivCell(w)}</td>
    </tr>
    <tr class="drow" style="display:none"><td colspan="15">${detailCell(w)}</td></tr>`;
}
// 欄位定義（順序對應表頭）：c=鍵 t=型別(n數字/s字串/io價內外/net淨剩/iv買IV) nat=首次點擊方向
const SORTCOLS = [
  {c:'id',t:'s',nat:'asc'},{c:'typ',t:'s',nat:'asc'},{c:'iss',t:'s',nat:'asc'},
  {c:'px',t:'n',nat:'desc'},{c:'vol',t:'n',nat:'desc'},{c:'spr',t:'n',nat:'asc'},
  {c:'lev',t:'n',nat:'desc'},{c:'de',t:'n',nat:'desc'},{c:'conv',t:'n',nat:'desc'},
  {c:'ovr',t:'n',nat:'desc'},{c:'sl',t:'n',nat:'asc'},{c:'io',t:'io',nat:'asc'},
  {c:'net',t:'net',nat:'desc'},{c:'per',t:'n',nat:'desc'},{c:'iv',t:'iv',nat:'desc'}
];
function _val(w, def){
  if(def.t==='s') return String(w[def.c]==null?'':w[def.c]);
  if(def.t==='net') return (w.net==null?null:w.net);
  if(def.t==='iv') return _n(w.ivb);
  if(def.t==='io'){ const v=_n(w.io); if(v==null) return null; return String(w.io).includes('價內')? -Math.abs(v): Math.abs(v); }
  return _n(w[def.c]);
}
let WPICKS = [], WSORT = {col:'sl', asc:true};
function setSort(c){
  const def = SORTCOLS.find(d=>d.c===c); if(!def) return;
  if(WSORT.col===c) WSORT.asc = !WSORT.asc;
  else WSORT = {col:c, asc:(def.nat==='asc')};
  renderRows();
}
function renderRows(){
  const def = SORTCOLS.find(d=>d.c===WSORT.col) || SORTCOLS[10];
  const asc = WSORT.asc, isStr = (def.t==='s');
  const arr = WPICKS.slice().sort((a,b)=>{
    const va=_val(a,def), vb=_val(b,def);
    const na=(va==null||va===''), nb=(vb==null||vb==='');
    if(na||nb) return na===nb?0:(na?1:-1);   // 空值一律排最後
    const r = isStr ? String(va).localeCompare(String(vb),'zh-TW') : (va-vb);
    return asc ? r : -r;
  });
  const tb = document.getElementById('wtbody');
  if(tb) tb.innerHTML = arr.map(rowHtml).join('');
  document.querySelectorAll('#wtable th[data-c]').forEach(th=>{
    const on = th.getAttribute('data-c')===WSORT.col;
    th.classList.toggle('sorted', on);
    const ar = th.querySelector('.sarrow'); if(ar) ar.textContent = on ? (asc?' ▲':' ▼') : '';
  });
}

function renderStock(data, code){
  const picks = (data.picks||{})[code] || [];
  const uname = picks.length ? (picks[0].u||'') : '';
  const asOf = data.as_of || '—';
  const head = `
    <div class="top">
      <span class="code">${esc(code)}</span>
      <span class="name">${esc(uname)}</span>
      <span class="tag">可買權證（挑過）</span>
    </div>
    <div class="meta">
      全市場・嚴格門檻（當天有成交量<span class="sep">・</span>買賣價差比≤3%<span class="sep">・</span>|價內外|≤20%<span class="sep">・</span>剩餘90~180天）
      依 <b>差槓比</b> 由小到大排（越小越划算）　資料時間：<b>${esc(asOf)}</b><br>
      <span class="links"><a href="${LIVE(code)}" target="_blank" rel="noopener">全部發行商即時 →</a>
      <a href="${SMART(code)}" target="_blank" rel="noopener">元大智慧選即時 →</a>
      <a class="back" href="warrants.html">← 所有標的</a></span>
    </div>`;
  if(!picks.length){
    document.getElementById('app').innerHTML = head +
      `<div class="empty">此門檻下無合格權證（可能沒有當天成交量、或都不符篩選條件）。<br>
       點上方「全部發行商即時」看 warrantwin 完整清單。</div>`;
    document.title = `${code} ${uname}｜可買權證`;
    return;
  }
  WPICKS = picks; WSORT = {col:'sl', asc:true};   // 預設差槓比升冪
  document.getElementById('app').innerHTML = head + `
    <table id="wtable">
      <thead><tr>
        <th data-c="id"   onclick="setSort('id')">權證<span class="sarrow"></span></th>
        <th data-c="typ"  onclick="setSort('typ')">類型<span class="sarrow"></span></th>
        <th data-c="iss"  onclick="setSort('iss')">發行商<span class="sarrow"></span></th>
        <th data-c="px"   onclick="setSort('px')">成交價<span class="sarrow"></span></th>
        <th data-c="vol"  onclick="setSort('vol')">成交量<span class="sarrow"></span></th>
        <th data-c="spr"  onclick="setSort('spr')">買賣價差比<span class="sarrow"></span></th>
        <th data-c="lev"  onclick="setSort('lev')">槓桿<span class="sarrow"></span></th>
        <th data-c="de"   onclick="setSort('de')"   title="有效Δ：標的漲1元，權證漲幾元（已含行使比例）。理論Δ(0~1)＝此值÷行使比例">Δ<span class="sarrow"></span></th>
        <th data-c="conv" onclick="setSort('conv')" title="每單位權證可換多少標的股數。行使比例×理論Δ＝有效Δ；但本表 Δ 欄已是有效Δ，勿再相乘">行使比例<span class="sarrow"></span></th>
        <th data-c="ovr"  onclick="setSort('ovr')"  title="流通在外量佔發行量比例(%)；越高代表籌碼多在外、發行商回收空間小">流通在外%<span class="sarrow"></span></th>
        <th data-c="sl"   onclick="setSort('sl')"   title="買賣價差比÷實質槓桿，越小越划算（預設排序）">差槓比<span class="sarrow"></span></th>
        <th data-c="io"   onclick="setSort('io')">價內外<span class="sarrow"></span></th>
        <th data-c="net"  onclick="setSort('net')"  title="標的每動1個tick權證漲多少(|delta|×tick) 對照 當天theta損耗；✓包過=前者≥後者。滑鼠移上看完整算式">1tick vs theta<span class="sarrow"></span></th>
        <th data-c="per"  onclick="setSort('per')">剩餘<span class="sarrow"></span></th>
        <th data-c="iv"   onclick="setSort('iv')"   title="發行商掛的買進/賣出隱波；箭頭為相對上次觀測變動。排序依買進隱波。滑鼠移上看歷史，抓偷調隱波">隱波 買/賣<span class="sarrow"></span></th>
      </tr></thead>
      <tbody id="wtbody"></tbody>
    </table>
    <div class="foot">點欄位標題可自訂排序（再點一次反向）；預設<b>依差槓比由小到大</b>。差槓比 = 買賣價差比 ÷ 實質槓桿（越小＝用越低的價差成本換到越高槓桿）。
    「1tick vs theta」= 標的每動 1 個 tick 權證漲多少（|delta|×tick，delta 已含行使比例）對照 當天 theta 損耗（|theta|）：
    <span class="tk ok">✓ 剩</span> 代表標的往有利方向動一檔就<b>包得過</b>當天時間價值損耗、<span class="tk bad">✗ 缺</span> 代表還差多少（認購看漲、認售看跌）。滑鼠移上看完整算式與檔數換算。
    隱波「買/賣」= 發行商掛的買進/賣出隱含波動率；▲▼ 為買進隱波相對上次觀測的變動，滑鼠移上顯示歷次變動紀錄（抓發行商偷調隱波）。每天跑會累積軌跡。</div>`;
  renderRows();
  document.title = `${code} ${uname}｜可買權證（${picks.length}）`;
}

function renderLanding(data){
  const picks = data.picks || {};
  const codes = Object.keys(picks);
  const asOf = data.as_of || '—';
  const cards = codes.map(c=>{
    const p=picks[c]; const uname=p.length?(p[0].u||''):'';
    return `<a class="card" href="warrants.html?code=${encodeURIComponent(c)}">
      <div class="c">${esc(c)}</div><div class="n">${esc(uname)}</div>
      <div class="k">${p.length} 檔挑過的權證</div></a>`;
  }).join('');
  document.getElementById('app').innerHTML = `
    <div class="top"><span class="name">可買權證篩選</span><span class="tag">全市場快照</span></div>
    <div class="meta">即將法說標的中、通過嚴格門檻的可買權證。資料時間：<b>${esc(asOf)}</b></div>
    ${codes.length? `<div class="cards">${cards}</div>` :
      `<div class="empty">目前沒有任何標的通過門檻。</div>`}
    <div class="foot">此頁與法說會網站分開維護：資料由 warrant_screener.py 產生 warrant_picks.json，本頁執行時讀取。</div>`;
  document.title = '可買權證篩選（全市場快照）';
}

fetch('warrant_picks.json', {cache:'no-store'})
  .then(r => { if(!r.ok) throw new Error('warrant_picks.json 讀取失敗'); return r.json(); })
  .then(data => { if(CODE) renderStock(data, CODE); else renderLanding(data); })
  .catch(err => {
    document.getElementById('app').innerHTML =
